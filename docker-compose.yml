---
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    # image: freqtradeorg/freqtrade:develop
    # Use plotting image
    # image: freqtradeorg/freqtrade:develop_plot
    # # Enable GPU Image and GPU Resources (only relevant for freqAI)
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # Build step - only needed when additional dependencies are needed
    # build:
    #   context: .
    #   dockerfile: "./docker/Dockerfile.custom"
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    # Freqtrade will automatically pick up FREQTRADE__DB_URL from Easypanel
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/nfi-live.json
      --strategy NostalgiaForInfinityX7

  freqtrade-ai:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade-ai
    volumes:
      - "./user_data:/freqtrade/user_data"
    # Uses FREQTRADE__DB_URL_AI from Easypanel Environment Variables
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freqtrade-ai.rule=Host(`ai-freqtradebot.crv1ic.easypanel.host`)"
      - "traefik.http.routers.freqtrade-ai.entrypoints=websecure"
      - "traefik.http.routers.freqtrade-ai.tls.certresolver=letsencrypt"
      - "traefik.http.services.freqtrade-ai.loadbalancer.server.port=8081"
    environment:
      - FREQTRADE__DB_URL=${FREQTRADE__DB_URL_AI}
      - FREQTRADE__API_SERVER__LISTEN_PORT=8081
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade-ai.log
      --config /freqtrade/user_data/config-ai.json
      --strategy SmartFreqaiStrategy
      --freqaimodel LightGBMRegressor
