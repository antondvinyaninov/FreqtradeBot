services:
  freqtrade:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      FREQTRADE__DB_URL: ${FREQTRADE__DB_URL:?Set the PostgreSQL URL in Easypanel.}
    volumes:
      - freqtrade_logs:/freqtrade/user_data/logs

volumes:
  freqtrade_logs:
